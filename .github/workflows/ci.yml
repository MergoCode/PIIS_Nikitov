name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/

      - name: Build image
        run: |
          docker build --build-arg EPOCHS=2 --build-arg SEED=42 -t kws-api:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d --name kws -p 8000:8000 kws-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Container is up and healthy!"
              break
            fi
            echo "Waiting for container ($i/30)..."
            sleep 2
          done

      - name: Smoke test API
        run: |
          echo "Checking /health endpoint:"
          curl -s http://localhost:8000/health
          echo -e "\nChecking /model-info endpoint:"
          curl -s http://localhost:8000/model-info
          echo -e "\nChecking /predict endpoint:"
          curl -f -X POST -F "file=@samples/yes.wav" http://localhost:8000/predict

      - name: Quality gate (Accuracy >= 75%)
        run: |
          ACC=$(curl -s http://localhost:8000/model-info | python -c "import sys, json; data=json.load(sys.stdin); print(data.get('accuracy', 0))")
          echo "Extracted accuracy: $ACC%"
          python -c "import sys; acc = float('$ACC'); sys.exit(0 if acc >= 99.999 else 1)"

      - name: Logs on failure
        if: failure()
        run: docker logs kws
